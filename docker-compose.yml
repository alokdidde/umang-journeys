services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: umang
      POSTGRES_USER: umang
      POSTGRES_PASSWORD: umang
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umang -d umang"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - umang_postgres:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://umang:umang@postgres:5432/umang
      PERSISTENCE_MODE: postgres
      SESSION_SECRET: local-docker-demo-secret-change-before-public-use
      EVALUATION_USER_EMAIL: ${EVALUATION_USER_EMAIL:-demo@umang.com}
      EVALUATION_USER_PASSWORD_HASH: ${EVALUATION_USER_PASSWORD_HASH:-umang-local-evaluation-account:0b5592ec095b2f13141fbcd6727e5c294698b9394ba71665a3954723dea8614754b886f8130054c49de0b54a844d71a37e9722a40e3ca8cb254e82d3d5508b48}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AI_INTAKE_MODEL: ${AI_INTAKE_MODEL:-openai/gpt-5.5}
      AI_DOCUMENT_MODEL: ${AI_DOCUMENT_MODEL:-openai/gpt-5.5}
    ports:
      - "3000:3000"

  migrate:
    build:
      context: .
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umang:umang@postgres:5432/umang

volumes:
  umang_postgres:
