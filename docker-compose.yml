services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: umang
      POSTGRES_USER: umang
      POSTGRES_PASSWORD: umang
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umang -d umang"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - umang_postgres:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://umang:umang@postgres:5432/umang
      PERSISTENCE_MODE: postgres
      SESSION_SECRET: local-docker-demo-secret-change-before-public-use
      EVALUATION_USER_EMAIL: ${EVALUATION_USER_EMAIL:-ananya@umang.local}
      EVALUATION_USER_PASSWORD_HASH: ${EVALUATION_USER_PASSWORD_HASH:-umang-local-evaluation-account:7cdaaf3f0d9be60c9110be7b3f91f261fd0c3e0b9516e7cca0742b263329562117c9fa209c2970b3a922fdcfbabad9a0f79372dca3a00895e1404f3242e41515}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "3000:3000"

  migrate:
    build:
      context: .
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umang:umang@postgres:5432/umang

volumes:
  umang_postgres:
